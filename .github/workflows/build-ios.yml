name: Build Flutter iOS

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      # 1. Select Xcode 15.4 (avoids Xcode 16 BoringSSL-GRPC compiler flag bug)
      - name: Select Xcode 15.4
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      # 2. Check out repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 3. Set up Java
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 4. Set up Flutter (Pinned to 3.19.6 to match development environment)
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      # 5. Disable SPM preview to force stable CocoaPods
      - name: Configure Flutter
        run: |
          flutter config --no-enable-swift-package-manager
          flutter pub get

      # 6. Build iOS app bundle (Simulator / unsigned test bundle)
      - name: Build iOS Application
        run: flutter build ios --simulator --no-tree-shake-icons

      # 7. Upload output as an artifact
      - name: Upload iOS Build Output
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-output
          path: build/ios/iphonesimulator/Runner.app
